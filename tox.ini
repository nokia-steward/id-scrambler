[tox]
requires = tox>=4
env_list =
    py311
    py312
    py313
    py314
    lint
    type
skip_missing_interpreters = true

[testenv]
description = Run tests with {base_python}
package = wheel
deps =
    pytest>=7.0
commands =
    pytest {posargs:tests}

[testenv:lint]
description = Run Ruff checks
skip_install = true
deps =
    ruff>=0.5
commands =
    ruff check id_scrambler tests

[testenv:type]
description = Run mypy checks
deps =
    mypy>=1.0
    types-PyYAML>=6.0
commands =
    mypy id_scrambler
