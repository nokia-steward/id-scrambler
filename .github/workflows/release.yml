name: Release

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Validate tag and package version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the form MAJOR.MINOR.PATCH"
            exit 1
          fi

          tag_version="$RELEASE_TAG"
          package_version="$(
            python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag version $tag_version does not match package version $package_version"
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Verify wheel installation
        shell: bash
        run: |
          python -m venv /tmp/id-scrambler-smoke
          /tmp/id-scrambler-smoke/bin/python -m pip install dist/*.whl
          /tmp/id-scrambler-smoke/bin/id_scrambler --version

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: pytest

  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install ".[dev]"

      - name: Run Ruff
        run: ruff check id_scrambler tests

      - name: Run mypy
        run: mypy id_scrambler

  pypi:
    name: Publish package to PyPI
    needs:
      - package
      - test
      - quality
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/id-scrambler/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
